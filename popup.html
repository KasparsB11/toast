<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toast:ext</title>
    <style>
        h1 {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            margin: 12px 0 10px;
            color: #d09745;
        }
        body {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            margin: 0;
            min-height: 300px;
            min-width: 300px;
            background-color: #FFF9C4;

        }
        #rulesContainer div {
            margin: 5px;
        }
        #mainH1 {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-weight: 800;
            display: block;
            padding: 0 24px;
            margin: 15px 20px;
            border: none;
            border-radius: 5px;
            background-color: #FBC02D;
            color: #836100;
            font-size: 16px;
            line-height: 8px;
            cursor: pointer;
            width: 260px;
            height: 35px;
        }
        #select {
            display: inline-block;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            color: #8e6c0b;
            font-size: 15px;
            font-weight: 800;
            text-align: center;
            padding: 0;
            margin: 0 8px;
            border: none;
            border-radius: 5px;
            background-color: #FBC02D;
            line-height: 7px;
            cursor: pointer;
            width: 120px;
            height: 35px;
            }
        #buttonGroup {
            display: block;
            text-align: center;
            margin-top: 25px;
        }
        #rulesContainer {
            margin: 30px 10px;
        }
        label {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size: 14px;
            color: #8e6c0b;
            font-weight: 400;
            margin: 0;
            padding: 0;
        }
        button:hover {
            background-color: #F9A825;
        }
    </style>
</head>
<body>
    <h1>Welcome to TOAST</h1>
    <button id="mainH1"> MAKE TOAST</button>
    <div id="buttonGroup">
        <button id="select"> Select all</button>
        <button id="select"> Clear all</button>
    </div>
    <div id="rulesContainer"></div>
    
    <script src="main.js"></script>
</body>
</html>
